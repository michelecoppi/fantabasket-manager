name: Supabase keep-alive

# Il piano gratuito di Supabase mette in pausa il progetto dopo circa 7 giorni senza attività.
# Una richiesta leggera ogni 3 giorni lo tiene attivo. La RLS risponde con una lista vuota: va bene, conta come attività.
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Mancano i secret SUPABASE_URL e SUPABASE_ANON_KEY"; exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL%/}/rest/v1/seasons?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $code"
          [ "$code" = "200" ]
